<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="860" fill="#ffffff"/>

  <text x="660" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Surf Conditions Agent — Data &amp; Control Flow</text>
  <text x="660" y="56" text-anchor="middle" font-size="13" fill="#64748b">Two entry points share one data layer — only one of them ever talks to Claude</text>

  <!-- Entry: question -->
  <rect x="90" y="90" width="460" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">User asks a question</text>
  <text x="320" y="144" text-anchor="middle" font-size="12" fill="#334155">surf_agent.py — REPL or single-shot CLI</text>

  <!-- Entry: chart -->
  <rect x="750" y="90" width="460" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="980" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">User requests a chart</text>
  <text x="980" y="144" text-anchor="middle" font-size="12" fill="#334155">surf_agent.py — 'chart' REPL word or --chart flag</text>

  <line x1="320" y1="170" x2="320" y2="210" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="980" y1="170" x2="980" y2="210" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Claude reasoning -->
  <rect x="90" y="210" width="460" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Claude — tool-calling loop (agent.py)</text>
  <text x="320" y="260" text-anchor="middle" font-size="11.5" fill="#334155">Computes ISO timestamps from "this afternoon"</text>
  <text x="320" y="278" text-anchor="middle" font-size="11.5" fill="#334155">Reasons over tool results → answers in plain language</text>
  <text x="320" y="298" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">Off-topic requests declined here — no tool call, no data fetched</text>

  <!-- chart.py deterministic -->
  <rect x="750" y="210" width="460" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="980" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">chart.py — deterministic rendering</text>
  <text x="980" y="260" text-anchor="middle" font-size="11.5" fill="#334155">Calls the same tool functions directly — no LLM in the loop</text>
  <text x="980" y="278" text-anchor="middle" font-size="11.5" fill="#334155">Builds chart.html (Plotly) → opens in your browser</text>
  <text x="980" y="298" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">Zero tokens spent, zero latency, zero hallucination surface</text>

  <line x1="320" y1="320" x2="320" y2="380" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="980" y1="320" x2="980" y2="380" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- tools.py -->
  <rect x="230" y="380" width="800" height="110" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="630" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">tools.py — the 4 tools</text>
  <text x="630" y="432" text-anchor="middle" font-size="11.5" fill="#334155">get_current_conditions · get_forecast_window · get_tide_predictions · get_best_surf_window</text>
  <text x="630" y="454" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">Every result carries data_is_stale + fetched_at, so Claude can caveat honestly</text>

  <!-- surf_criteria.py -->
  <rect x="1080" y="395" width="190" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="1175" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">surf_criteria.py</text>
  <text x="1175" y="440" text-anchor="middle" font-size="10.5" fill="#334155">THRESHOLDS +</text>
  <text x="1175" y="454" text-anchor="middle" font-size="10.5" fill="#334155">evaluate_hour()</text>
  <text x="1175" y="472" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">pure, pytest-covered</text>

  <line x1="1030" y1="435" x2="1080" y2="440" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1055" y="425" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">evaluates</text>

  <line x1="630" y1="490" x2="630" y2="540" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ingest.py -->
  <rect x="230" y="540" width="800" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="630" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">ingest.py — ensure_forecast_coverage / ensure_tide_coverage</text>
  <text x="630" y="588" text-anchor="middle" font-size="11" fill="#334155">Compares the wall clock to each cached row's fetched_at — refetches ONLY if stale or missing</text>
  <text x="630" y="608" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">This check runs before Claude ever sees the request — it has no vote</text>

  <line x1="430" y1="630" x2="410" y2="670" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="830" y1="630" x2="890" y2="670" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- db.py -->
  <rect x="180" y="670" width="460" height="100" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="410" y="698" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">db.py — SQLite cache (data/surf.db)</text>
  <text x="410" y="720" text-anchor="middle" font-size="11" fill="#334155">spots · forecast_conditions · tide_predictions · daily_astro</text>
  <text x="410" y="740" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">Read on every request; written only on refresh</text>

  <!-- External APIs -->
  <rect x="660" y="670" width="460" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="890" y="698" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">External APIs — called only when cache is stale</text>
  <text x="890" y="720" text-anchor="middle" font-size="11" fill="#78350f">Open-Meteo (Marine + Forecast) · NOAA CO-OPS tide predictions</text>
  <text x="890" y="740" text-anchor="middle" font-size="10" font-style="italic" fill="#92400e">On failure: keep serving cached data, flag data_is_stale=true</text>

  <line x1="660" y1="720" x2="640" y2="720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="706" text-anchor="middle" font-size="9.5" font-style="italic" fill="#78350f">upsert</text>

  <!-- Legend -->
  <rect x="100" y="812" width="16" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="124" y="825" font-size="11.5" fill="#334155">Claude reasoning path</text>

  <rect x="380" y="812" width="16" height="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="404" y="825" font-size="11.5" fill="#334155">Deterministic path (no LLM)</text>

  <rect x="700" y="812" width="16" height="16" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="724" y="825" font-size="11.5" fill="#334155">Shared tool / data layer</text>

  <rect x="1000" y="812" width="16" height="16" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1024" y="825" font-size="11.5" fill="#334155">External third-party APIs</text>
</svg>
